name: Axolotl desktop CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  pull_request:
    paths-ignore:
      - 'apps/telemetry-dashboard/**'
      - 'apps/telemetry-worker/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check immutable database migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/axolotl/check-migrations.mjs --base "${MIGRATION_BASE_REF:-HEAD^}"
          node scripts/axolotl/check-migrations.mjs --release
      - run: node scripts/axolotl/brand-guard.mjs
      - run: node scripts/axolotl/i18n-check.mjs
      - run: node scripts/axolotl/check-css-vars.mjs
      - run: node scripts/axolotl/check-orphan-components.mjs
      - run: node scripts/axolotl/check-scoped-styles.mjs
      - run: node scripts/axolotl/check-retired-ui.mjs
      - run: node scripts/axolotl/downgrade-app-db.test.mjs
      - run: cargo fmt --all --check

  # The frontend lint and test suites were previously never run in CI, so
  # design-system regressions (duplicate components, boundary violations,
  # broken tests) could merge silently.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser for visual tests
        run: pnpm --filter @modrinth/ui exec playwright install --with-deps chromium
      - name: Lint frontend packages
        run: |
          pnpm --filter @modrinth/ui lint
          pnpm --filter @modrinth/app-frontend lint
          pnpm --filter @modrinth/assets lint
          pnpm --filter @modrinth/utils lint
          pnpm --filter @modrinth/server lint
          pnpm --filter @modrinth/api-client lint
          pnpm --filter @modrinth/tooling-config lint
          pnpm --filter @axolotl/website lint
      - name: Test shared UI package
        run: pnpm --filter @modrinth/ui test
      - name: Test desktop frontend
        run: pnpm --filter @modrinth/app-frontend test
      - name: Test desktop frontend overlays
        run: pnpm --filter @modrinth/app-frontend test:visual

  desktop:
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      SQLX_OFFLINE: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      # Replaces an sccache setup whose startup probe failed on every run:
      # the shared cache service rejected it, the enable step was skipped, and
      # Windows rebuilt the whole dependency tree uncached (~56 minutes).
      # The shared key deliberately matches the release workflow's build job,
      # so tagged releases can restore the cache this job keeps warm on main.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: axolotl-rust-deps
          # A failing build still warms the cache for the next attempt.
          cache-on-failure: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Install Blockbench skin editor dependencies
        run: npm ci
        working-directory: third-party/blockbench
      - uses: ./.github/actions/replace-gradle-mirror
      - run: pnpm --filter @modrinth/app-frontend build
      - name: Check for dead alpha utilities
        run: node scripts/axolotl/check-dead-utilities.mjs
      - name: Test version metadata writes
        run: cargo test --package theseus writing_version_info_creates_missing_parent_directory
      - run: cargo check --package theseus_gui --features updater
      - name: Test Windows installer UI and core
        if: runner.os == 'Windows'
        run: |
          cargo test --package axolotl-installer-ui
          pnpm --filter @modrinth/app-frontend exec playwright install chromium
          node --test apps/installer-ui/tests/installer-ui.test.cjs
      - name: Build modern Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @modrinth/app tauri build --config tauri-release.conf.json --config tauri-modern.conf.json
      - name: Verify modern Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one modern NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built modern installer: $($installers[0].Name)"
      - name: Test actual Windows uninstallation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --prefix target/uninstall-verification --no-save --no-audit --no-fund handlebars@4.7.8
          if ($LASTEXITCODE -ne 0) { throw "Failed to prepare NSIS fixture dependencies" }
          node apps/installer-ui/tests/compile-fixture.cjs --tauri-nsis target/release/nsis/x64
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile NSIS uninstall fixture" }
          & apps/installer-ui/tests/uninstall-smoke.ps1
      - name: Build native NSIS Windows installer
        if: runner.os == 'Windows'
        run: pnpm --filter @modrinth/app tauri build
      - name: Verify native NSIS Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one native NSIS installer, found $($installers.Count)"
          }
          Write-Output "Built native NSIS installer: $($installers[0].Name)"

  # Keeps the cross-compiled architectures building. Without this, nothing in
  # PR CI would notice a dependency or a build script that breaks riscv64 or
  # loongarch64, and the release job would fail only once a tag was pushed.
  cross-arch:
    name: Cross-compile (${{ matrix.name }})
    needs: guardrails
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: riscv64
            arch: riscv64
            rustArch: riscv64
            target: riscv64gc-unknown-linux-gnu
            suite: trixie
            roots: >-
              gcc-riscv64-linux-gnu libc6-dev-riscv64-cross binutils-riscv64-linux-gnu
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          # loongarch64 cannot be bundled by tauri-bundler, whose `binary_arch`
          # panics on the target triple. This job only compiles; the release
          # matrix packages it with scripts/axolotl/bundle-linux.mjs.
          - name: loongarch64
            arch: loong64
            rustArch: loongarch64
            target: loongarch64-unknown-linux-gnu
            suite: sid
            roots: >-
              gcc-loongarch64-linux-gnu libc6-dev-loong64-cross binutils-loongarch64-linux-gnu
              libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
    env:
      SQLX_OFFLINE: true
      CROSS_ARCH: ${{ matrix.arch }}
      CROSS_TARGET: ${{ matrix.target }}
      CROSS_SUITE: ${{ matrix.suite }}
      CROSS_ROOTS: ${{ matrix.roots }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Set up cross sysroot
        run: |
          export CROSS_BASE="$RUNNER_TEMP/cross"
          scripts/axolotl/setup-cross-sysroot.sh \
            "$CROSS_ARCH" "$CROSS_TARGET" "$CROSS_SUITE" $CROSS_ROOTS
          cat "$RUNNER_TEMP/cross/$CROSS_ARCH-$CROSS_SUITE/env.sh" >> "$GITHUB_ENV"
          rustup target add "$CROSS_TARGET"
      - uses: actions/setup-java@dd6320883cc2b7b3d898c5d895402d970a1b62 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/replace-gradle-mirror
      - name: Check the launcher compiles for this architecture
        run: cargo check --package theseus_gui --target "$CROSS_TARGET" --features updater
      - name: Check a package can be built for this architecture
        # A compile-only check would pass even if the packaging step were broken,
        # so build the real executable and package it. This runs without a
        # signing key, so only packaging is verified, not the upload.
        env:
          CROSS_TARGET: ${{ matrix.target }}
          CROSS_ARCH: ${{ matrix.arch }}
          CROSS_RUST_ARCH: ${{ matrix.rustArch }}
        run: |
          cargo build --release --package theseus_gui --target "$CROSS_TARGET" --features updater
          node scripts/axolotl/verify-linux-package.mjs \
            --target "$CROSS_TARGET" \
            --arch "$CROSS_RUST_ARCH" \
            --version "$(node -p "require('./apps/app-frontend/package.json').version")"

  website:
    needs: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axolotl/website build
